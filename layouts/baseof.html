<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}" data-theme="light">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{- partial "nav.html" . }}
  <main>
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}

  {{- $js := resources.Get "js/theme.js" }}
  {{- if hugo.IsProduction }}{{ $js = $js | minify | fingerprint }}{{ end }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
